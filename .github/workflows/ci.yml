# SPDX-License-Identifier: Apache-2.0
# Continuous integration (US-008): lint, build (incl. layering check), tests with coverage thresholds,
# SPDX headers on Windows, macOS and Linux; license scan and dependency audit (NFR-023, NFR-025, NFR-027).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint + Prettier)
        run: pnpm lint
      - name: Build (tsc -b + layering rules)
        run: pnpm build
      - name: SPDX headers
        run: pnpm check:spdx
      - name: Tests with coverage thresholds
        run: pnpm coverage
      - name: Electron end-to-end tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Electron end-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - name: Performance tests (sequential, NFR timing targets)
        run: pnpm test:perf
      # US-009: unsigned installers (NSIS / dmg / AppImage + deb) and a launch of the packaged app.
      - name: Package installers
        run: pnpm package
      - name: Packaged app smoke test (Windows/macOS)
        if: runner.os != 'Linux'
        run: pnpm test:packaged
      - name: Packaged app smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:packaged
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          retention-days: 14

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: License scan (production dependencies)
        run: pnpm check:licenses
      - name: Dependency audit (high/critical in production dependencies)
        run: pnpm audit:deps
