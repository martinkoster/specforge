# SPDX-License-Identifier: Apache-2.0
# US-045 AC-4: the shared AgentAdapter contract suite against the real Claude Code on all three OSes.
# Manually triggered; runs real model calls (costs usage) with the ANTHROPIC_API_KEY repository secret (ADR-007).
name: claude-adapter-live

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runners to use (JSON array)
        default: '["windows-latest", "macos-latest", "ubuntu-latest"]'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: Install Claude Code (user installation, CON-002)
        run: npm install -g @anthropic-ai/claude-code
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Live contract suite
        env:
          SPECFORGE_LIVE_CLAUDE: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm exec vitest run packages/adapters/agent-claude-code/test/contract.live.test.ts --reporter=verbose
