# SPDX-License-Identifier: Apache-2.0
# US-045 AC-4: the shared AgentAdapter contract suite against the real Claude Code on all three OSes.
# Manually triggered; runs real model calls. Auth (input `auth`): `subscription` uses the developer's Claude
# subscription token (repository secret CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`; test-only — the product
# never uses subscription logins), `api-key` the ANTHROPIC_API_KEY secret (ADR-007, costs API credit).
# Only the selected credential is passed: Claude Code prefers an API key over an OAuth token.
name: claude-adapter-live

on:
  workflow_dispatch:
    inputs:
      auth:
        description: Credential to use
        type: choice
        options: [subscription, api-key]
        default: subscription
      os:
        description: Runners to use (JSON array)
        default: '["windows-latest", "macos-latest", "ubuntu-latest"]'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: Install Claude Code (user installation, CON-002)
        run: npm install -g @anthropic-ai/claude-code
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Live contract suite
        env:
          SPECFORGE_LIVE_CLAUDE: '1'
          ANTHROPIC_API_KEY: ${{ inputs.auth == 'api-key' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.auth == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: pnpm exec vitest run packages/adapters/agent-claude-code/test/contract.live.test.ts --reporter=verbose
